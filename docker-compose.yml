services:
  browser:
    build: .
    image: keepalive-browser:local
    shm_size: "2gb"
    environment:
      URL: "https://google.com/"
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
      # No default on purpose: an empty value starts x11vnc without a password.
      VNC_PASSWORD: "${VNC_PASSWORD:?set VNC_PASSWORD in .env, see .env.example}"
      KIOSK: "0"
      WINDOW_MANAGER: "1"
      AUDIO: "pulse"
      CLICK_DELAY: "60"
      CLICK_XY: "684 500"
      # CDP слушает 127.0.0.1 внутри контейнера и наружу не публикуется:
      # это полный контроль над браузером без всякой аутентификации.
      # Управлять им: docker compose exec browser cdp <команда>.
      CDP_BIND: "127.0.0.1"
    ports:
      - "127.0.0.1:6080:6080"   # noVNC
      - "127.0.0.1:5900:5900"   # VNC
    volumes:
      - profile:/profile
    # Процесс и так не root (uid 1000), эти две строки закрывают путь наверх.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  profile:
